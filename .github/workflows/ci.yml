name: Vol Dashboard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance arch tensorflow keras streamlit plotly pytest pytest-cov flake8 mypy bandit

      - name: Run Linting (Flake8)
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Type Checking (Mypy)
        run: |
          set +e
          mypy src/ --ignore-missing-imports
          exit 0

      - name: Run App / Validation Check
        run: |
          export PYTHONPATH=src:.
          # Runs app in headless/import check mode or executes volatility engine script if app.py runs continuously
          python -c "import app" || python app.py --ci || true

      - name: Run Pytest Suite
        run: |
          export PYTHONPATH=src:.
          pytest tests/ --cov=src --cov-report=term-missing
